[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibescan"
version = "0.1.0"
description = "로컬 Git 저장소용 웹앱 보안 진단기"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3",
  "PyJWT[crypto]>=2.10,<3", "pathspec>=0.12,<1",
  "pywin32>=306; sys_platform == 'win32'", "semgrep==1.185.0",
]

[project.scripts]
vibescan = "vibescan.cli:main"

[tool.setuptools]
packages = ["scanner", "vibescan"]

[tool.setuptools.data-files]
"share/vibescan" = ["rules/sample.yml"]
