{
  "rules": [
    {
      "id": "vs-js-jwt",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "검증 없는 JWT 해석",
      "metadata": {
        "cwe": "CWE-347",
        "kisa": [
          "CI-16"
        ],
        "vibescan": {
          "title_ko": "검증 없는 JWT 해석",
          "remediation_ko": "서버 인가 전 jwt.verify로 서명과 클레임을 검증하세요.",
          "severity": "High",
          "confidence": "Potential",
          "impact_ko": "jwt.decode는 서명을 검증하지 않고 내용만 읽습니다. 공격자가 토큰의 사용자 ID나 권한을 바꿔도 그대로 믿게 되어 다른 사용자나 관리자로 행세할 수 있습니다.",
          "fix_example": "-const user = jwt.decode(token)\n+const user = jwt.verify(token, process.env.JWT_SECRET, { algorithms: [\"HS256\"] })"
        }
      },
      "pattern": "jwt.decode(...)"
    }
  ]
}
