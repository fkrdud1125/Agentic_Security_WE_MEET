{
  "rules": [
    {
      "id": "vs-js-error",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "오류 스택의 응답 노출",
      "metadata": {
        "cwe": "CWE-209",
        "kisa": [
          "CI-04"
        ],
        "vibescan": {
          "title_ko": "오류 스택의 응답 노출",
          "remediation_ko": "사용자에게는 일반 오류만 보여주고 상세 스택은 보호된 서버 로그에 남기세요.",
          "severity": "Medium",
          "confidence": "Potential"
        }
      },
      "pattern-either": [
        {
          "pattern": "$RES.send($ERR.stack)"
        },
        {
          "pattern": "$RES.json({..., stack: $ERR.stack, ...})"
        }
      ]
    }
  ]
}
