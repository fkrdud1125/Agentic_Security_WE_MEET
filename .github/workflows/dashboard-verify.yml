name: Dashboard verification
on:
  push:
    branches: [feat/dashboard-redesign]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and verify official font
        shell: python
        run: |
          import base64, hashlib, pathlib, urllib.request
          path = pathlib.Path("vibescan/web/fonts/PretendardVariable.woff2")
          if not path.exists():
              url = "https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2"
              data = urllib.request.urlopen(url, timeout=60).read()
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == "49c54b5152a184a243e85f7281ed338b6569987e"
              path.write_bytes(data)
          data = path.read_bytes()
          print("FONT_EXPORT_START")
          encoded = base64.b64encode(data).decode()
          for start in range(0, len(encoded), 2048):
              print("FONT_CHUNK:" + encoded[start:start + 2048])
          print("FONT_EXPORT_END")
      - run: python -m pip install . -r vulnapp/requirements.txt httpx
      - run: python -m unittest discover -s tests
      - run: node tests/test_dashboard_ui.cjs
      - name: Verify installed font outside repository
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          script = "from pathlib import Path; from fastapi.testclient import TestClient; from vibescan.dashboard import dashboard_app; c=TestClient(dashboard_app(Path('missing'),'127.0.0.1:8765','test'),base_url='http://127.0.0.1:8765'); r=c.get('/assets/fonts/PretendardVariable.woff2'); assert r.status_code==200 and r.content[:4]==b'wOF2'; assert c.get('/assets/theme.js').status_code==200; assert c.get('/assets/fonts/unknown.woff2').status_code==404"
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run([sys.executable, "-c", script], cwd=tmp, check=True)
