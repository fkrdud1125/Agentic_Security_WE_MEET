name: VibeScan CLI verification
on:
  push:
    branches: [verify/sprint1-cli]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r vulnapp/requirements.txt httpx
      - run: python -m unittest discover -s tests -v
      - name: Installed offline CLI on a fresh Git fixture
        shell: python
        run: |
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          from scanner.models import ScanResult
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              sample = base / "sample"
              sample.mkdir()
              for f in ("app.py", "static_cases.py", "requirements.txt"):
                  shutil.copy(Path("vulnapp") / f, sample / f)
              subprocess.run(["git","init","-q"],cwd=sample,check=True)
              subprocess.run(["git","add","."],cwd=sample,check=True)
              subprocess.run(["git","-c","user.name=Test","-c","user.email=test@example.invalid","commit","-qm","sample"],cwd=sample,check=True)
              env = dict(os.environ, XDG_CONFIG_HOME=str(base / "config"), LOCALAPPDATA=str(base / "config"))
              subprocess.run(["vibescan","scan",str(sample),"--offline","--output",str(base / "out")],cwd=base,env=env,check=True)
              raw = next((base / "out").glob("*/scan_result.json"))
              r = ScanResult.from_json(raw.read_text(encoding="utf-8"))
              assert sorted(f.cwe for f in r.findings) == ["CWE-798","CWE-79","CWE-89"] or {f.cwe for f in r.findings} == {"CWE-798","CWE-79","CWE-89"}
              assert len(r.findings) == 3 and r.profile.framework == "Flask" and r.profile.routes == 2
              assert "we_meet_fixture_token" not in raw.read_text(encoding="utf-8")
              assert raw.with_name("report.md").read_text(encoding="utf-8") == r.report_md
              print("CLI E2E passed:", r.profile.framework, r.profile.routes, "routes,", len(r.findings), "findings")
